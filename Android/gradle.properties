# The Gradle daemon's heap: AGP, Compose and Robolectric's tests.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# A platform, build tools or NDK that is not installed fails the build: nothing is fetched into
# the SDK behind the builder's back.
android.builder.sdkDownload=false
