# Every version the Android app builds with, pinned (000 §5.1, 003 §3). Bump deliberately, with
# `Tools/test.sh android` green. Gradle's own version and checksum are in
# gradle/wrapper/gradle-wrapper.properties.
[versions]
# The SDK the app is compiled against and targets, and the build tools that package it.
compile-sdk = "36"
build-tools = "36.0.0"
# Android 10: the app's minimum, and the API level the NDK's clang builds the core for.
min-sdk = "29"
# The NDK: core-engine builds the core's library with its clang, and the app strips the native
# libraries with it.
ndk = "28.2.13676358"
agp = "9.5.1"
kotlin = "2.4.21"
# Compose 1.11.4 with Material 3 1.4.0: the newest set that compiles against android-36. The
# sets after it (Compose 1.12) need android-37; move both together.
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
coroutines = "1.11.0"
# The contract's messages as Kotlin, generated at build time from Core/proto (001 §9, F8).
wire = "7.1.2"
# The System WebView's newer APIs, a profile per login set among them (000 §4.2).
webkit = "1.18.0"
junit = "4.13.2"
# The window's tests run on the JVM, on Robolectric's Android.
robolectric = "4.17"
androidx-test-core = "1.7.0"
# The tests that run on a device or an emulator (003 §8): the instrumentation's runner, and
# JUnit's runner for Android.
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# Android's accessibility checks (Google's Accessibility Test Framework) for a Compose screen on
# a device: the window's audit, as Apple's is for the Apple apps. Its version is the BOM's.
compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
