name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Core
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (Core/rust-toolchain.toml)
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Core/Cargo.lock', 'Core/rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: The Android glue (the jni feature)
        run: cargo clippy -p wt-ffi --features jni --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The Apple shell builds with Xcode 27. GitHub has it on one image, a preview, labelled
  # `xcode-27` (macOS 27); the `macos-26` image stops at Xcode 26.
  apple:
    name: Apple shell (lint, unit, build)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)" && xcodebuild -version && sw_vers
      - name: Cache tools, SwiftPM and the Rust build
        uses: actions/cache@v4
        with:
          path: |
            Tools/bin
            Tools/.downloads
            Packages/.build
            Core/target
            ~/.cargo/registry
          key: ${{ runner.os }}-apple-${{ hashFiles('Tools/bootstrap.sh', 'Packages/Package.resolved', 'Core/Cargo.lock') }}
      - run: Tools/bootstrap.sh
      - run: Tools/test.sh lint
      - run: Tools/test.sh unit
      - run: Tools/test.sh build
      # A snapshot that does not match (docs/features/004) leaves what was drawn and the
      # difference beside the picture checked in. Nobody can look at this machine's screen.
      - name: Keep the pictures that did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-macos
          path: |
            Packages/Tests/WTUITests/__Snapshots__/**/*.actual.png
            Packages/Tests/WTUITests/__Snapshots__/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 7

  simulators:
    name: Apple shell (iOS simulator, UI)
    if: github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)" && xcodebuild -version && sw_vers
      - name: The screen the UI tests will draw on
        run: system_profiler SPDisplaysDataType | grep -E "Resolution|Retina|Display Type" || true
      - run: Tools/bootstrap.sh
      - run: Tools/test.sh ios
      - run: Tools/test.sh ui
      # A UI test that fails here and passes on a developer's Mac is failing because of
      # something on this machine's screen. Its result bundle has the screenshot.
      - name: Keep the tests' results and pictures when one fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            .build/DerivedData/Logs/Test/*.xcresult
            Packages/Tests/WTUITests/__Snapshots__/**/*.actual.png
            Packages/Tests/WTUITests/__Snapshots__/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 7
