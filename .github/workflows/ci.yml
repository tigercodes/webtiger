name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Core
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (Core/rust-toolchain.toml)
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Core/Cargo.lock', 'Core/rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: The Android glue (the jni feature)
        run: cargo clippy -p wt-ffi --features jni --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  apple:
    name: Apple shell (lint, unit, build)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Cache tools, SwiftPM and the Rust build
        uses: actions/cache@v4
        with:
          path: |
            Tools/bin
            Tools/.downloads
            Packages/.build
            Core/target
            ~/.cargo/registry
          key: ${{ runner.os }}-apple-${{ hashFiles('Tools/bootstrap.sh', 'Packages/Package.resolved', 'Core/Cargo.lock') }}
      - run: Tools/bootstrap.sh
      - run: Tools/test.sh lint
      - run: Tools/test.sh unit
      - run: Tools/test.sh build

  simulators:
    name: Apple shell (iOS simulator, UI)
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)" && xcodebuild -version
      - run: Tools/bootstrap.sh
      - run: Tools/test.sh ios
      - run: Tools/test.sh ui
