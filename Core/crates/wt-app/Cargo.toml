[package]
name = "wt-app"
description = "The headless app: the models the shells subscribe to, and the contract's dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The host bridge's answers (oneshot) and timeouts, and the local tasks a
# request that waits on the shell runs as.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
wt-core.workspace = true
wt-proto.workspace = true
wt-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }
wt-testkit.workspace = true

[lints]
workspace = true
