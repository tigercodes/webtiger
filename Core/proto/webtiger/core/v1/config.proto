// What a shell passes to wt_core_start.
syntax = "proto3";

package webtiger.core.v1;

import "webtiger/core/v1/common.proto";
import "wt/options.proto";

option java_multiple_files = true;
option java_package = "com.tigercodes.webtiger.core.v1";
option swift_prefix = "WT";

// Passed to wt_core_start.
message CoreConfig {
  // The contract the shell was built with. The core refuses another major; a
  // different minor works, because both sides ignore fields they don't know.
  uint32 contract_major = 1;
  uint32 contract_minor = 2;
  Platform platform = 3;
  // BCP 47, such as "en-GB".
  string locale = 4;
  // Per-user application data: the store lives here. Ignored in fake mode,
  // whose store is in memory.
  string data_dir = 5 [(wt.redact) = true];
  TestMode test_mode = 6;
  // Fake mode's knobs. Read with TEST_MODE_FAKE only.
  FakeOptions fake = 7;
  // The app's version, such as "0.1.0". For diagnostics.
  string app_version = 8;
  // The engines this shell can create web views with, the default first. At
  // least one. A pack installed later is announced with a request (W6).
  repeated EngineInfo engines = 9;
  // Since 1.47. The device, as the shell finds it when it starts (054): the
  // core works out from it how many tabs may be alive at once. A window made
  // wide or narrow, or a foldable opened, after that changes nothing.
  DeviceKind device_kind = 10;
  // Since 1.47. The device's memory, in megabytes. 0 when the shell does
  // not know.
  uint32 memory_megabytes = 11;
}

// What a shell runs on, for the limit of live tabs (054).
enum DeviceKind {
  // Taken for a desktop.
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_PHONE = 1;
  DEVICE_KIND_TABLET = 2;
  DEVICE_KIND_DESKTOP = 3;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_MACOS = 1;
  // iPhone and iPad.
  PLATFORM_IOS = 2;
  PLATFORM_WINDOWS = 3;
  PLATFORM_ANDROID = 4;
  // The `webtiger` command line and headless tests.
  PLATFORM_CLI = 5;
}

enum TestMode {
  // Read as TEST_MODE_LIVE.
  TEST_MODE_UNSPECIFIED = 0;
  TEST_MODE_LIVE = 1;
  // Deterministic: the store is in memory, ids are fixed, and nothing on the
  // device is read or written. UI suites run in it (WEBTIGER_FAKE=1).
  TEST_MODE_FAKE = 2;
}

message FakeOptions {
  // An address every new window's first tab opens (WEBTIGER_FAKE_START).
  // Empty: the tab starts empty.
  string start_address = 1 [(wt.redact) = true];
  // Since 1.15. Nobody has chosen a search engine yet (020): the core says
  // so, and a shell asks. Without it fake mode takes the engine that stands
  // in as chosen: its store is in memory, and every run would be a first.
  bool first_run = 2;
  // Since 1.42. How far fake mode's clock moves each time it is read, in
  // seconds. 0: one second. A suite that must see a day pass (049) says a
  // day: the core's own rules are then the ones that run, at their own
  // times, and only the clock is quicker.
  uint32 seconds_a_read = 3;
  // Since 1.46. How long a tab is out of sight before it is put to sleep
  // (053), in seconds, for a suite that must see one sleep: the core then
  // looks every second. 0: the usual time, half an hour, looked for every
  // minute.
  uint32 sleep_after_seconds = 4;
  // Since 1.47. The most tabs that are alive at once (054), for a suite
  // that must see the limit met. 0: none. Fake mode has no limit of its
  // own, whatever the device: a suite that opens five tabs on a phone is
  // about something else.
  uint32 live_tabs = 5;
  // Since 1.48. The core acts as though it had been told the system is
  // short of memory (055, MemoryShort with MEMORY_LEVEL_SHORT), every so
  // many seconds, for a suite that must see what follows: no suite may make
  // a system short of memory. 0: never.
  uint32 memory_short_every_seconds = 6;
  // Since 1.51. The core starts on the standard session of the plan's
  // budgets (000 §7, 060): five Spaces, two hundred Sites and forty tabs,
  // made in its store as it starts, the first Space shown with its last tab
  // in front. That tab is at `start_address`, and is the one page that is
  // alive; every other tab is asleep, at an address nothing is fetched from.
  // For an app that is to be measured on the standard session: fake mode's
  // store is in memory, and nothing of anybody's is in it.
  bool standard_session = 7;
  // Since 1.52. Addresses the core opens by itself, in this order, one every
  // `open_every_seconds` from the first thing a shell sends: each as an
  // address the system hands a shell from outside is opened (OpenAddress,
  // 031), in a new tab, in front, in the window that was opened first and is
  // not private. One that is no address of the web is passed over. While
  // there is no such window the next waits. When the last has been opened
  // the core's timer for them stops. For a run that is to be measured with a
  // list of sites open (063), with nothing in the app automated.
  repeated string open_addresses = 8 [(wt.redact) = true];
  // Since 1.52. The seconds between them. 0: none is opened.
  uint32 open_every_seconds = 9;
  // Since 1.52. The limit of live tabs is the device's own, as it is outside
  // fake mode (054), where fake mode has none: for a run that is to be of
  // the app as it is (063). A limit a suite gives (`live_tabs`) comes first.
  bool device_limits = 10;
  // Since 1.53. Rules for Guard, in the syntax the public lists are written
  // in, a rule to a line: fake mode's blocker is made of them as the core
  // starts (064). For a suite that must see a request refused, with rules of
  // its own. Empty: Guard has no rules, and allows everything.
  string guard_rules = 11;
}

// One engine a shell offers.
message EngineInfo {
  EngineKind kind = 1;
  // The engine's own version, such as "621.1.15" or "142.0.7444.60". For
  // diagnostics and, later, the minimum-safe-version rule.
  string version = 2;
}
