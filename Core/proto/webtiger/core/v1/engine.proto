// What a shell reports about a web view (000 §5.5). Each is a Request sent
// with envelope id 0: a notification, which the core does not answer.
//
// Only main-frame events are reported. A shell maps its engine's callbacks
// to these (001 §5 lists the mapping for each engine), so the core sees one
// event order whatever the engine.
//
// Two rules every adapter keeps, because the address field depends on them:
//   - An address is reported as the page's (NavigationCommitted,
//     AddressChanged) only once that page owns the web view. Where a load is
//     heading is NavigationStarted's to say, and nothing else's.
//   - A main-frame navigation the shell refuses on the core's verdict
//     (wt_nav_check) is reported as NavigationFailed "net.cancelled" by the
//     shell itself when its engine then reports nothing, so a tab the user
//     sent there does not wait for ever.
syntax = "proto3";

package webtiger.core.v1;

import "webtiger/core/v1/common.proto";
import "wt/options.proto";

option java_multiple_files = true;
option java_package = "com.tigercodes.webtiger.core.v1";
option swift_prefix = "WT";

message EngineEvent {
  uint64 web_view_id = 1;
  oneof kind {
    NavigationStarted navigation_started = 2;
    NavigationCommitted navigation_committed = 3;
    NavigationFinished navigation_finished = 4;
    NavigationFailed navigation_failed = 5;
    AddressChanged address_changed = 6;
    TitleChanged title_changed = 7;
    ProgressChanged progress_changed = 8;
    HistoryChanged history_changed = 9;
    RendererGone renderer_gone = 10;
    // Since 1.2
    NewWindowRequested new_window_requested = 11;
    CloseRequested close_requested = 12;
    // Since 1.4
    OutsideLinkRequested outside_link_requested = 13;
    // Since 1.6
    FindResult find_result = 14;
    // Since 1.9
    DownloadRequested download_requested = 15;
    DownloadProgress download_progress = 16;
    DownloadFinished download_finished = 17;
    DownloadFailed download_failed = 18;
    // Since 1.10
    PermissionRequested permission_requested = 19;
    PermissionWithdrawn permission_withdrawn = 20;
    // Since 1.12
    DialogRequested dialog_requested = 21;
    // Since 1.13
    SignInRequested sign_in_requested = 22;
    // Since 1.14
    LinkOpenRequested link_open_requested = 23;
    // Since 1.17
    SearchRequested search_requested = 24;
  }
}

// A load began. The page it asks for does not own the web view yet.
message NavigationStarted {
  string url = 1 [(wt.redact) = true];
}

// The page at `url` now owns the web view: its content is what is on screen.
message NavigationCommitted {
  string url = 1 [(wt.redact) = true];
}

// The load that committed has finished.
message NavigationFinished {}

// A load failed, before or after it committed.
message NavigationFailed {
  // "net.cancelled" (not shown as a failure), "net.offline", "net.dns",
  // "net.connect", "net.timeout", "net.tls", "net.failed". Under "net.tls",
  // where the engine says which kind of certificate trouble it was (021):
  // "net.tls.untrusted", "net.tls.date", "net.tls.name".
  string code = 1;
  string url = 2 [(wt.redact) = true];
  // Since 1.3. The shell refused the navigation on the core's verdict, and
  // with that the web view is left loading nothing. `code` is
  // "net.cancelled", which is also how a load that was stopped or replaced
  // ends; this says which. A window a page opened that is refused the only
  // place it was going has nothing to show, and the core closes its tab
  // (006).
  bool refused = 3;
  // Since 1.20 (026). With "net.tls.untrusted", "net.tls.date" or
  // "net.tls.name", for the web view's own page: the adapter holds the
  // certificate it refused, at the host and port of `url`, and can be told
  // to let it through (WebViewTrustCertificate). Nothing is let through
  // until it is told.
  bool certificate_held = 4;
}

// The page on screen changed its own address without a load: a fragment, or
// the History API. Never the address a load is heading for.
message AddressChanged {
  string url = 1 [(wt.redact) = true];
}

message TitleChanged {
  string title = 1 [(wt.redact) = true];
}

message ProgressChanged {
  // 0 to 1.
  double fraction = 1;
}

message HistoryChanged {
  bool can_go_back = 1;
  bool can_go_forward = 2;
}

// The process drawing the page died. The web view shows nothing until it is
// loaded again.
message RendererGone {}

// A page asked for a new window: a link with a target, or window.open
// (006). `EngineEvent.web_view_id` is the web view that asked.
//
// The page keeps a hold on the window it opens, so the engine itself must
// make the new web view, at once. This is the one web view a shell makes
// unasked. It makes it in the asking web view's login set, shows it nowhere,
// and names it itself: an id with its top bit set, which the core's own ids
// never have, and which it never uses again.
//
// The core answers by what it does next. It adopts the web view: a tab has
// it, and a snapshot says so. Or it refuses it: WebViewDestroy.
message NewWindowRequested {
  uint64 new_web_view_id = 1;
  // Where the page wants the new window to go, when the engine says. It is
  // the asking page's claim, and is never shown as the new page's address.
  string url = 2 [(wt.redact) = true];
  // The page asked while the user was doing something to it: a click, a key.
  bool user_gesture = 3;
}

// The page asked for its own window to be closed (window.close()). The core
// closes the tab when a page opened it, and not otherwise.
message CloseRequested {}

// A page tried to go to an address that is not a browser's: wt_nav_check
// answered EXTERNAL for it (a letter to write, a number to ring, another
// app's own scheme), and the shell refused it in the web view (007).
// Reported for a frame as for the page itself, and before the
// NavigationFailed that the refusal may also be reported as.
//
// The shell opens nothing by itself. Whether the address is handed to the
// system is the core's to say: it asks with OpenOutside (host.proto).
message OutsideLinkRequested {
  string url = 1 [(wt.redact) = true];
  // A person asked: a click or a key, as far as the engine says.
  bool user_gesture = 2;
}

// What a WebViewFind found (010). Reported after each one, and again when an
// engine that counts has finished counting.
message FindResult {
  // The text is on the page.
  bool found = 1;
  // The engine counts matches: `matches` and `current` mean something.
  bool counted = 2;
  uint32 matches = 3;
  // Which match is shown, counted from 1. 0 when none is.
  uint32 current = 4;
}

// Downloads (013). Since 1.9.

// A web view's page asked for a download: a response the engine cannot show,
// one that says it is an attachment, or a link that says "download". Nothing
// has been saved yet. The core answers with the host request DownloadStart,
// which names the file, or DownloadCancel.
//
// `download_id` is the shell's own name for the download, as a web view a
// page asked for has an id of the shell's own (006): every later word about
// the download, from either side, names it so. What the event says of a web
// view matters only here; the reports that follow are about the download,
// whatever has become of the web view.
message DownloadRequested {
  uint64 download_id = 1;
  string url = 2 [(wt.redact) = true];
  // What the site suggests the file is called. Never a name to save under:
  // the core makes that (013 §4).
  string suggested_filename = 3 [(wt.redact) = true];
  string mime_type = 4;
  // How big the site says the file is. 0 when it did not say.
  uint64 expected_bytes = 5;
  // Since 1.16 (022). The person asked for this file themselves: a choice in
  // a menu, the shell's or the engine's own ("Save Picture", "Download Linked
  // File"). No page asked, so the core asks nobody whether the site may
  // download. A shell says so of nothing else.
  bool user_asked = 6;
}

// How far a download has got. An engine reports it as often as it likes; a
// shell passes on a few times a second at most.
message DownloadProgress {
  uint64 download_id = 1;
  uint64 received_bytes = 2;
  // 0 while it is still not known.
  uint64 expected_bytes = 3;
}

// A download's file is whole, in the system's place for downloads.
message DownloadFinished {
  uint64 download_id = 1;
  // The name it was saved under: the one DownloadStart gave, or that name
  // with " (2)" and so on when it was taken.
  string file_name = 2 [(wt.redact) = true];
}

// A download ended without its file. What was saved of it is gone.
message DownloadFailed {
  uint64 download_id = 1;
  // "download.cancelled" (it was stopped), "download.network",
  // "download.disk" (it could not be written), or "download.failed".
  string code = 2;
}

// A page asks to use something of the device's (014). The page waits: the
// shell answers it only when the core has said how (PermissionAnswer,
// host.proto), and says "no" by itself to nothing but a request whose web
// view it destroys.
//
// `request_id` is the shell's own name for the request, never used twice.
// `origin` is who asks: the scheme, host and port of the frame that asked,
// as `https://example.com`. The core refuses a request that is not the
// page's own, so a shell reports the frame's and decides nothing.
message PermissionRequested {
  uint64 request_id = 1;
  string origin = 2 [(wt.redact) = true];
  // What it asks for: one or more. Granted whole, or not at all.
  repeated PermissionKind kinds = 3;
}

// The page no longer waits for an answer to a request: it withdrew it, or
// the engine did. Nothing is to be answered.
message PermissionWithdrawn {
  uint64 request_id = 1;
}

// A page says something, or asks (016): `alert`, `confirm` or `prompt`. The
// page's script waits: the shell answers it only when the core has said how
// (DialogAnswer, host.proto), and shows nothing of its own.
//
// `request_id` is the shell's own name for it, never used twice. `origin` is
// the frame that called, as for a PermissionRequested: the core dismisses
// what is not the page's own.
message DialogRequested {
  uint64 request_id = 1;
  string origin = 2 [(wt.redact) = true];
  DialogKind kind = 3;
  // The page's words.
  string message = 4 [(wt.redact) = true];
  // With DIALOG_KIND_PROMPT: the text the page offers.
  string default_text = 5 [(wt.redact) = true];
}

// A server asks who is there before it answers (017): HTTP authentication
// that a name and a password answer. The load waits: the shell answers the
// engine only when the core has said how (SignInAnswer, host.proto), and
// shows nothing of its own.
//
// `request_id` is the shell's own name for it, never used twice. A proxy's
// question, and one that a name and a password do not answer (a
// certificate), are not reported: they are the engine's, as before.
message SignInRequested {
  uint64 request_id = 1;
  // The server that asks: its host, as the engine names it.
  string host = 2 [(wt.redact) = true];
  // The server's origin, where the engine names it; empty where it names
  // the host alone.
  string origin = 3 [(wt.redact) = true];
  // The server's own name for what it protects. Questions are told apart
  // by it; it is never shown.
  string realm = 4 [(wt.redact) = true];
  // Where the web view's load was heading when the server asked, redirects
  // followed; empty when no load was in flight. The core asks the person
  // only about a server the tab is going to, or its page's own.
  string heading = 5 [(wt.redact) = true];
  // The server refused an answer to this already.
  bool again = 6;
}

// The person asked that a link of the page open in a new tab (018): by the
// link's menu, or by how they pressed it (a key held). The web view whose
// page has the link is `EngineEvent.web_view_id`; the shell has left that
// page where it is. The core opens the tab, or does not: nothing else comes
// of this.
message LinkOpenRequested {
  // The link's address.
  string url = 1 [(wt.redact) = true];
  // The tab in front stays in front; the new one opens behind it.
  bool background = 2;
  // The person did it: a choice from a menu, a press. A page that only made
  // it look so is not obeyed.
  bool user_gesture = 3;
}

// The person asked to search for words of the page (023): words they had
// selected, by the shell's item in the menu that selecting gives. The web
// view whose page has the words is `EngineEvent.web_view_id`. The core opens
// the search in a new tab, with the engine the person chose (020), or does
// not: nothing else comes of this. Since 1.17.
message SearchRequested {
  // The words, as they were selected. The core tidies and cuts them.
  string text = 1 [(wt.redact) = true];
  // The person did it: a choice from a menu. A page that only made it look
  // so is not obeyed.
  bool user_gesture = 2;
}
