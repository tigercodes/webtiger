// Host services (000 §5.5): what the core asks the platform for, as a
// HostRequest the shell answers with exactly one HostResponse carrying the
// request's envelope id.
//
// W0 has the health check and the WebViews service. The answer must be the
// request's kind (HostPing → HostPong; every WebView request → Ack) or an
// Error with a code ("webview.unknown"). The core reports anything else as
// "host.wrong_answer", no answer within its timeout as "host.timeout", and an
// Error whose code isn't "area.reason" as "host.failed", so no text travels
// through an error.
syntax = "proto3";

package webtiger.core.v1;

import "webtiger/core/v1/common.proto";
import "wt/options.proto";

option java_multiple_files = true;
option java_package = "com.tigercodes.webtiger.core.v1";
option swift_prefix = "WT";

message HostRequest {
  oneof kind {
    HostPing ping = 1;
    WebViewCreate web_view_create = 2;
    WebViewLoad web_view_load = 3;
    WebViewCommand web_view_command = 4;
    WebViewDestroy web_view_destroy = 5;
    // Since 1.4
    OpenOutside open_outside = 6;
    // Since 1.6
    WebViewFind web_view_find = 7;
    // Since 1.8
    WebViewSetZoom web_view_set_zoom = 8;
    // Since 1.9
    DownloadStart download_start = 9;
    DownloadCancel download_cancel = 10;
    // Since 1.10
    PermissionAnswer permission_answer = 11;
    // Since 1.12
    DialogAnswer dialog_answer = 12;
    // Since 1.13
    SignInAnswer sign_in_answer = 13;
    // Since 1.20
    WebViewTrustCertificate web_view_trust_certificate = 14;
    // Since 1.22
    OpenFile open_file = 15;
    // Since 1.39
    WebViewFetchIcon web_view_fetch_icon = 16;
    // Since 1.44
    WebViewSaveState web_view_save_state = 17;
    WebViewRestore web_view_restore = 18;
    // Since 1.50
    WebViewSnapshot web_view_snapshot = 19;
  }
}

message HostResponse {
  oneof kind {
    Error error = 1;
    Ack ack = 2;
    HostPong pong = 3;
    // Since 1.44
    WebViewState web_view_state = 4;
    // Since 1.50
    WebViewPicture web_view_picture = 5;
  }
}

// The contract's health check through the shell (Ping.via_host).
message HostPing {
  bytes payload = 1;
}

message HostPong {
  bytes payload = 1;
}

// An identity: one data store per engine (cookies, storage, cache, service
// workers, permissions). Web views in different login sets share nothing.
message LoginSet {
  // A UUID, lower case with hyphens. The shell names the engine's store by
  // it: WKWebsiteDataStore(forIdentifier:), a WebView2 profile, an Android
  // WebView profile.
  string id = 1 [(wt.redact) = true];
  // A private window's: the engine keeps it in memory and nothing is written.
  bool ephemeral = 2;
}

// WebViews: creates a web view, not yet on screen and showing nothing. The
// shell keeps it under `web_view_id` and shows it where a snapshot's TabView
// names it. Answered with Ack, or "engine.unavailable" when the shell has no
// such engine.
message WebViewCreate {
  // Chosen by the core, never 0, never reused, and never with its top bit
  // set: those ids are the shell's, for the one web view it makes unasked
  // (NewWindowRequested, engine.proto).
  uint64 web_view_id = 1;
  EngineKind engine = 2;
  LoginSet login_set = 3;
}

// WebViews: loads an address. Answered with Ack once the load was started;
// how it goes arrives as EngineEvents. "webview.unknown" for an id the shell
// doesn't have.
message WebViewLoad {
  uint64 web_view_id = 1;
  string url = 2 [(wt.redact) = true];
}

// WebViews: back, forward, reload or stop. Answered with Ack, also when the
// web view had nowhere to go.
message WebViewCommand {
  uint64 web_view_id = 1;
  NavigationCommand command = 2;
}

// WebViews: destroys a web view and releases its engine resources. Answered
// with Ack, also when the shell no longer had it.
message WebViewDestroy {
  uint64 web_view_id = 1;
}

// Since 1.44. WebViews: the engine's own state of a web view (051): what
// another web view can be made from, as far as the engine keeps it (the list
// Back and Forward go through, where a page was scrolled to). The core keeps
// it and never reads it. Answered with WebViewState, whose bytes are empty
// when the engine has none to give; or "webview.unknown".
message WebViewSaveState {
  uint64 web_view_id = 1;
}

message WebViewState {
  bytes state = 1 [(wt.redact) = true];
}

// Since 1.44. WebViews: makes a web view what a state says (051), and loads
// the page it was at. Where the engine will not take the state (it is
// another engine's, an older version's, or damaged), `url` is loaded
// instead, as WebViewLoad would load it: the tab wakes either way, and
// which way is the shell's to know. Answered with Ack once one or the other
// has begun; how it goes arrives as EngineEvents. "webview.unknown".
message WebViewRestore {
  uint64 web_view_id = 1;
  bytes state = 2 [(wt.redact) = true];
  string url = 3 [(wt.redact) = true];
}

// Since 1.50. WebViews: a picture of what a web view shows now (059): the
// part of its page that is in sight, as the engine last drew it, whether or
// not the web view is on the screen. A JPEG no wider than `max_width` pixels
// and of no more than `max_bytes` bytes: a shell draws it smaller until it
// is both. The core asks as a tab is put to sleep, keeps the picture with
// the web view's state, and never looks at it: it is shown where the page
// will be while the tab wakes. Answered with WebViewPicture, whose bytes are
// empty when the engine has none to give, or none that small; or
// "webview.unknown".
message WebViewSnapshot {
  uint64 web_view_id = 1;
  uint32 max_width = 2;
  uint32 max_bytes = 3;
}

message WebViewPicture {
  bytes jpeg = 1 [(wt.redact) = true];
  // Its size, in pixels.
  uint32 width = 2;
  uint32 height = 3;
}

// System: opens an address that is not a browser's with whatever the system
// has for it: the mail app for a letter, the dialler for a number (007).
// The core asks only for addresses it has decided may leave the browser; a
// shell opens nothing of the kind unasked. Answered with Ack once the system
// has taken the address, or with "system.no_handler" when nothing on the
// device opens it. In fake mode a shell opens nothing and answers Ack.
message OpenOutside {
  string url = 1 [(wt.redact) = true];
}

// WebViews: finds text in a web view's page and shows the match (010): the
// first one, or with the same text again the next, or the one before with
// `backwards`. Empty text clears what was found. Answered with Ack, or
// "webview.unknown". What was found is reported as FindResult
// (engine.proto), not in the answer: an engine may go on counting.
message WebViewFind {
  uint64 web_view_id = 1;
  string text = 2 [(wt.redact) = true];
  bool backwards = 3;
}

// WebViews: sets a web view's zoom (012), which stays, whatever page it goes
// on to, until it is set again. 100 is actual size; a web view that was
// never asked is at 100. Answered with Ack, or "webview.unknown". An engine
// that cannot zoom a whole page zooms what it can (its text), and says
// nothing of the difference.
message WebViewSetZoom {
  uint64 web_view_id = 1;
  uint32 percent = 2;
}

// Downloads (013). Since 1.9.

// Starts a download the shell reported (DownloadRequested), saving its file
// under `file_name` in the system's place for downloads. The name is the
// core's and is safe to write as it is; when it is taken the shell adds
// " (2)", and says in DownloadFinished what it used. Answered with Ack once
// the download has begun, or "download.unknown" for one the shell does not
// have (it was given up on meanwhile).
message DownloadStart {
  uint64 download_id = 1;
  string file_name = 2 [(wt.redact) = true];
}

// Drops a download: one that was reported and never started, or one that is
// coming, of which nothing is left saved. Answered with Ack, also for a
// download the shell does not have.
message DownloadCancel {
  uint64 download_id = 1;
}

// How the page that asked is answered (014): it may use what it asked for,
// all of it, or none of it. Answered with Ack, also for a request the shell
// no longer has: its page went away meanwhile.
//
// "Granted" is the core's word about the site. Whether the system lets the
// app itself use the camera, the microphone or the location is the system's
// own matter, and a shell that is refused there tells the page no.
message PermissionAnswer {
  uint64 request_id = 1;
  bool granted = 2;
}

// The page's answer to what it said or asked (016). `accepted` is OK: an
// `alert` returns, a `confirm` is true, a `prompt` is `text`. Not accepted,
// the page is answered as if the person had closed it: an `alert` returns
// all the same, a `confirm` is false, a `prompt` is null. Answered with Ack,
// also for a request the shell no longer has.
message DialogAnswer {
  uint64 request_id = 1;
  bool accepted = 2;
  string text = 3 [(wt.redact) = true];
}

// The answer to a server that asked who is there (017). `accepted`: the
// engine answers it with `name` and `password`, and may keep them for that
// server until the app quits, in the web view's login set and no other. Not
// accepted: the engine gives the server no answer, and shows what it sent
// with its refusal. Answered with Ack, also for a request the shell no
// longer has.
message SignInAnswer {
  uint64 request_id = 1;
  bool accepted = 2;
  string name = 3 [(wt.redact) = true];
  string password = 4 [(wt.redact) = true];
}

// WebViews, since 1.20 (026): lets through, for this web view's login set,
// the certificate this web view last refused, at the host and port it was
// refused for. That certificate and no other, at that host and port and no
// other, until the app quits: an adapter keeps the exception in memory and
// nowhere else. Answered with Ack; "webview.unknown", or
// "certificate.unknown" when the adapter holds no certificate it refused
// for this web view.
message WebViewTrustCertificate {
  uint64 web_view_id = 1;
}

// Since 1.22. System: opens a file this shell saved as a download, by the
// name it was saved under, with whatever the system has for its kind (030).
// The core asks only for a download that has finished, on a person's press;
// a shell opens no file unasked. What the system is handed is the file and
// nothing else: not where it came from, and no leave beyond reading that
// one file. Answered with Ack once the system has taken the file;
// "system.no_handler" when nothing on the device opens it;
// "download.missing" when the file is not where it was saved. In fake mode
// a shell opens nothing and answers Ack.
message OpenFile {
  string file_name = 1 [(wt.redact) = true];
  // What the site said the file is. Empty when it did not say: the shell
  // then goes by the file's name.
  string mime_type = 2;
}

// Since 1.39. Fetch a page's icon (046): asked of an engine that hands an
// app none, for the one of the icons the page named (IconNamed) that the
// core chose. The shell fetches it by itself, and as nobody: with no cookie
// sent or kept, no login, nothing kept of what comes back but the picture;
// following only what stays on `https`, or on this device; and no more than
// 200 KB. Answered with Ack at once. The picture, when there is one, comes
// as IconReceived naming `page_url`, as a PNG of at most 128 pixels a side;
// a fetch that fails, and what is no picture, say nothing.
// "webview.unknown".
message WebViewFetchIcon {
  uint64 web_view_id = 1;
  string url = 2 [(wt.redact) = true];
  // The page it is the icon of.
  string page_url = 3 [(wt.redact) = true];
}
