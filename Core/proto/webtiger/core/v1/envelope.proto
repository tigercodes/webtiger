// WebTiger Core ↔ shell contract (docs/features/000-master-plan.md §5.5,
// docs/features/001-foundations.md §4).
// Contract version: 1.38 (WT_CONTRACT_MAJOR / WT_CONTRACT_MINOR in webtiger_core.h)
//   1.1  Tabs: OpenTab, CloseTab, ActivateTab, TabOpened; WindowSnapshot.tabs.
//   1.2  A page that asks for a new window: NewWindowRequested, CloseRequested;
//        web view ids with their top bit set are the shell's.
//   1.3  NavigationFailed.refused: a refusal told apart from a load that was
//        stopped or replaced.
//   1.4  A link for the system: OutsideLinkRequested; the host request
//        OpenOutside.
//   1.5  History: QueryHistory, HistoryPage, HistoryEntry, ForgetHistory.
//   1.6  Find on the page: FindInPage, FindView (TabView.find); the host
//        request WebViewFind; FindResult.
//   1.7  Places offered as the address field is typed in: SuggestAddresses,
//        AddressSuggestions, AddressSuggestion.
//   1.8  Zoom: ZoomPage, ZoomView (TabView.zoom); the host request
//        WebViewSetZoom.
//   1.9  Downloads: DownloadRequested, DownloadProgress, DownloadFinished,
//        DownloadFailed; the host requests DownloadStart and DownloadCancel;
//        QueryDownloads, DownloadsPage, DownloadEntry, CancelDownload,
//        ForgetDownloads; WindowSnapshot.downloads_active.
//
// Every message crosses the C ABI as protobuf bytes:
//   wt_core_start(CoreConfig)   config.proto
//   wt_core_send(Envelope)      a Request (id chosen by the shell; 0 for a
//                               notification, which gets no Response) or a
//                               HostResponse (id of the HostRequest it answers)
//   sink ← Envelope             Responses, Events (id 0) and HostRequests
//
// The files: this one has the envelope and its parts; common.proto the shared
// types and Error; config.proto CoreConfig; browser.proto windows and tabs;
// engine.proto what a shell reports about a web view; host.proto the host
// services.
//
// Changing the contract:
//   - Within v1, changes are additive only: new fields, messages and oneof
//     cases. Never renumber, retype or reuse a field number; mark a removed
//     one `reserved`. Bump WT_CONTRACT_MINOR and the version line above.
//     (Until the first public beta nothing has shipped, and a W-phase may
//     still reshape a message; 001 records each such change.)
//   - Run Tools/proto/generate.sh afterwards. The generated code is checked
//     in, so no build runs a code generator; `Tools/test.sh lint` fails when
//     it is stale.
//   - User-visible text never crosses the boundary. Errors and statuses are
//     stable codes ("area.reason"); the shells turn codes into words.
//   - Mark every field that may carry personal data `[(wt.redact) = true]`.
//     A browser's addresses and titles are exactly that.
syntax = "proto3";

package webtiger.core.v1;

import "webtiger/core/v1/browser.proto";
import "webtiger/core/v1/common.proto";
import "webtiger/core/v1/engine.proto";
import "webtiger/core/v1/host.proto";

option java_multiple_files = true;
option java_package = "com.tigercodes.webtiger.core.v1";
option swift_prefix = "WT";

message Envelope {
  // A request's id, chosen by the shell, correlates its response; a request
  // sent with id 0 is a notification and gets none. A host request's id,
  // chosen by the core, correlates the shell's answer. Events carry 0.
  uint64 id = 1;
  oneof body {
    Request request = 10;
    Response response = 11;
    Event event = 12;
    HostRequest host_request = 13;
    HostResponse host_response = 14;
  }
}

// Shell → core. The core takes requests in the order they arrive: a
// request's effect on the models comes before the next request's, though a
// request that waits (on the shell) never holds up others.
message Request {
  oneof kind {
    Ping ping = 1;
    Subscribe subscribe = 2;
    Unsubscribe unsubscribe = 3;
    // browser.proto
    OpenWindow open_window = 4;
    CloseWindow close_window = 5;
    SubmitAddress submit_address = 6;
    TabCommand tab_command = 7;
    // engine.proto. Sent as a notification (envelope id 0).
    EngineEvent engine_event = 8;
    // browser.proto, since 1.1
    OpenTab open_tab = 9;
    CloseTab close_tab = 10;
    ActivateTab activate_tab = 11;
    // browser.proto, since 1.5
    QueryHistory query_history = 12;
    ForgetHistory forget_history = 13;
    // browser.proto, since 1.6
    FindInPage find_in_page = 14;
    // browser.proto, since 1.7
    SuggestAddresses suggest_addresses = 15;
    // browser.proto, since 1.8
    ZoomPage zoom_page = 16;
    // browser.proto, since 1.9
    QueryDownloads query_downloads = 17;
    CancelDownload cancel_download = 18;
    ForgetDownloads forget_downloads = 19;
    // browser.proto, since 1.10
    AnswerPrompt answer_prompt = 20;
    QueryPermissions query_permissions = 21;
    ForgetPermissions forget_permissions = 22;
    // Since 1.15
    QuerySearch query_search = 23;
    ChooseSearchEngine choose_search_engine = 24;
    // Since 1.18
    QuerySpaces query_spaces = 25;
    CreateSpace create_space = 26;
    RenameSpace rename_space = 27;
    SwitchSpace switch_space = 28;
    // Since 1.19
    ColourSpace colour_space = 29;
    // Since 1.20
    ProceedPastCertificate proceed_past_certificate = 30;
    // Since 1.21
    SearchWords search_words = 31;
    // Since 1.22
    OpenDownload open_download = 32;
    // Since 1.23
    OpenAddress open_address = 33;
    // Since 1.24
    Undo undo = 34;
    // Since 1.25
    StepTab step_tab = 35;
    // Since 1.29
    KeepTab keep_tab = 36;
    LetGoSite let_go_site = 37;
    // Since 1.30
    SendSiteHome send_site_home = 38;
    // Since 1.31
    MakeGroup make_group = 39;
    RenameGroup rename_group = 40;
    ColourGroup colour_group = 41;
    ShutGroup shut_group = 42;
    RemoveGroup remove_group = 43;
    MoveToGroup move_to_group = 44;
    // Since 1.32
    SetFavourite set_favourite = 45;
    // Since 1.33
    SetLayout set_layout = 46;
    // Since 1.34
    UndoArrangement undo_arrangement = 47;
    // Since 1.35
    MoveTab move_tab = 48;
    MoveGroup move_group = 49;
    // Since 1.37
    QueryIcons query_icons = 50;
  }
}

// Core → shell: the answer to the Request with the envelope's id.
message Response {
  oneof kind {
    Error error = 1;
    Ack ack = 2;
    Pong pong = 3;
    Subscribed subscribed = 4;
    // browser.proto
    WindowOpened window_opened = 5;
    TabOpened tab_opened = 6;
    // Since 1.5
    HistoryPage history_page = 7;
    // Since 1.7
    AddressSuggestions address_suggestions = 8;
    // Since 1.9
    DownloadsPage downloads_page = 9;
    // Since 1.10
    PermissionsPage permissions_page = 10;
    // Since 1.15
    SearchSettings search_settings = 11;
    // Since 1.18
    SpacesPage spaces_page = 12;
    SpaceCreated space_created = 13;
    // Since 1.31
    GroupMade group_made = 14;
    // Since 1.37
    IconsPage icons_page = 15;
  }
}

// Core → shell, unasked.
message Event {
  oneof kind {
    CoreStatus status = 1;
    Snapshot snapshot = 2;
  }
}

// The contract's health check.
message Ping {
  // Echoed in Pong. At most 64 KiB ("ping.payload_too_large").
  bytes payload = 1;
  // Ask the shell's HostPing on the way, so a test covers the round trip.
  bool via_host = 2;
  // The panic fence's test hook: the core panics while answering, and must
  // answer "core.panic" and carry on. Honoured in fake mode only.
  bool panic = 3;
}

message Pong {
  bytes payload = 1;
  bool via_host = 2;
  // The core's own version, such as "0.1.0".
  string core_version = 3;
  uint32 contract_major = 4;
  uint32 contract_minor = 5;
}

// Subscribes to a model. Answered with Subscribed; the model's snapshot
// follows at once as an Event, and again whenever the model changes. Changes
// that arrive together are published as one snapshot.
message Subscribe {
  oneof topic {
    WindowTopic window = 1;
  }
}

message WindowTopic {
  uint64 window_id = 1;
}

message Subscribed {
  // Never 0. Names the subscription in its Snapshots and in Unsubscribe.
  uint64 subscription_id = 1;
}

// Ends a subscription. Answered with Ack, also when it had already ended.
message Unsubscribe {
  uint64 subscription_id = 1;
}

message Snapshot {
  uint64 subscription_id = 1;
  oneof model {
    WindowSnapshot window = 2;
  }
}

// The core's own state. STATE_READY follows a successful start;
// STATE_FATAL with a code ("start.bad_config", "start.contract_major",
// "start.store") is all a refused start sends.
message CoreStatus {
  State state = 1;
  string code = 2;

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_READY = 1;
    STATE_FATAL = 2;
  }
}
