// Windows and tabs: what a shell asks for and what it draws.
//
// A window has tabs in an order, and one of them in front (1.1; 005). W2
// builds the sidebar tree and the tab strip over them; the requests here
// stay.
syntax = "proto3";

package webtiger.core.v1;

import "webtiger/core/v1/common.proto";
import "wt/options.proto";

option java_multiple_files = true;
option java_package = "com.tigercodes.webtiger.core.v1";
option swift_prefix = "WT";

// Opens a window in the default Space, with one tab. Answered with
// WindowOpened. In fake mode the tab opens FakeOptions.start_address.
message OpenWindow {
  // Since 1.26. A private window (037): its logins are its own, made now and
  // thrown away with the window, and the core writes nothing of what it
  // visits. It has no Space to switch, and never comes back with the session.
  bool private_window = 1;
}

message WindowOpened {
  uint64 window_id = 1;
  uint64 tab_id = 2;
}

// Closes a window: its tabs' web views are destroyed and its subscriptions
// end. Answered with Ack, or "window.unknown".
message CloseWindow {
  uint64 window_id = 1;
}

// What the user typed in the address field, as typed. The core decides
// whether it is an address or a search, fixes it up, and loads it in the tab.
// Answered with Ack once the web view was told to load, or an Error:
// "address.empty", "tab.unknown", or the host's.
message SubmitAddress {
  uint64 tab_id = 1;
  string text = 2 [(wt.redact) = true];
}

// Back, forward, reload or stop for a tab. Answered with Ack, "tab.unknown",
// or "tab.no_page" when the tab has no web view yet.
message TabCommand {
  uint64 tab_id = 1;
  NavigationCommand command = 2;
}

// Opens a tab in a window. Answered with TabOpened once its page, if it was
// given one, was asked of the shell, or with "window.unknown". A tab given no
// text is empty and has no web view.
message OpenTab {
  uint64 window_id = 1;
  // What the tab opens, as it would be typed in an address field: the core
  // decides whether it is an address or a search. Empty: an empty tab.
  string text = 2 [(wt.redact) = true];
  // Leave the tab in front where it is; the new one opens behind it.
  bool background = 3;
  // The tab the new one is put after, when it is a tab of this window.
  // Otherwise, and for 0, the new tab goes at the end.
  uint64 after_tab_id = 4;
}

message TabOpened {
  uint64 tab_id = 1;
}

// Closes a tab: its web view is destroyed. If it was in front, the tab after
// it comes forward, or the one before it when it was the last. A window
// always has a tab: an empty one takes the place of its only tab. Answered
// with Ack, or "tab.unknown".
message CloseTab {
  uint64 tab_id = 1;
}

// Brings a tab in front in its window. Answered with Ack, or "tab.unknown".
message ActivateTab {
  uint64 tab_id = 1;
  // Since 1.28. The tab was chosen from what was offered while typing in the
  // tab in front (038). When that tab is an empty one, it is closed: it was
  // opened to go somewhere, and the person went to a tab that was open.
  bool chosen_while_typing = 2;
}

// Sites (039). Since 1.29.

// Keeps a tab: it becomes a Site, whose home is the page it shows and whose
// name is that page's title. A Site is among the first tabs of its row, after
// the Sites that were there. Closing it (CloseTab) puts it to sleep at its
// home and leaves it in the row; bringing it in front wakes it. It comes back
// after a quit. Answered with Ack, also when the tab is a Site already;
// "tab.unknown"; "tab.no_page" for a tab with no page of the web's; or
// "window.private": nothing of a private window is kept.
message KeepTab {
  uint64 tab_id = 1;
}

// Lets a Site go: it is a tab like any other again, the first of its row's
// other tabs, as it is. Answered with Ack, also when the tab is no Site; or
// "tab.unknown".
message LetGoSite {
  uint64 tab_id = 1;
}

// Since 1.30. Sends a Site back to its home: the home is loaded in it, as
// an address the person asked for. Answered with Ack, also when the tab is
// no Site or is not away from its home (nothing happens); or "tab.unknown".
// Where a load of a Site's home lands is its home from then on: a home that
// sends the browser on to another address is at that address.
message SendSiteHome {
  uint64 tab_id = 1;
}

// Groups (041). Since 1.31. A Group is a folder of Sites in a Space's row:
// one level deep. A private window has none ("window.private").

// Makes a Group in the row a window shows, after the Groups there are.
// The name is what a Space's may be: trimmed, and not empty
// ("group.name_empty"). Answered with GroupMade; "window.unknown";
// "window.private"; or "group.too_many".
message MakeGroup {
  uint64 window_id = 1;
  string name = 2 [(wt.redact) = true];
}

message GroupMade {
  uint64 group_id = 1;
}

// Answered with Ack; "group.unknown"; or "group.name_empty".
message RenameGroup {
  uint64 group_id = 1;
  string name = 2 [(wt.redact) = true];
}

// Gives a Group one of the colours a Space can have, by its name, or none
// (empty). Answered with Ack; "group.unknown"; or "group.colour_unknown".
message ColourGroup {
  uint64 group_id = 1;
  string colour = 2;
}

// Shuts a Group, or opens it. Shut, its Sites are out of the way: they are
// left out of what the window is told to draw, and no tab is changed by it.
// Answered with Ack, also when it is so already; or "group.unknown".
message ShutGroup {
  uint64 group_id = 1;
  bool shut = 2;
}

// Takes a Group away. Its Sites stay, in no Group. Answered with Ack; or
// "group.unknown".
message RemoveGroup {
  uint64 group_id = 1;
}

// Puts a tab in a Group of its row, at the Group's end. A tab that is no
// Site is kept first (KeepTab), and one that cannot be kept is refused as
// KeepTab refuses it. With group_id 0 a Site is taken out of its Group, and
// a tab that is in none is left as it is. Answered with Ack; "tab.unknown";
// "group.unknown" (also for a Group of another row); "tab.no_page"; or
// "window.private".
message MoveToGroup {
  uint64 tab_id = 1;
  uint64 group_id = 2;
}

message GroupSummary {
  uint64 group_id = 1;
  string name = 2 [(wt.redact) = true];
  // The name of its colour; empty for none.
  string colour = 3;
  bool shut = 4;
  // How many Sites it holds, shown or not.
  uint32 sites = 5;
}

// Favourites (042). Since 1.32. Marks a tab as one of its row's Favourites,
// or unmarks it. A Favourite is a Site: a tab that is no Site is kept first
// (KeepTab), and one that cannot be kept is refused as KeepTab refuses it.
// It is in no Group: marked, a Site leaves the Group it was in, and put in a
// Group (MoveToGroup) it is a Favourite no longer. Marked, it is the last of
// the Favourites; unmarked, the last of the Sites that are in no Group.
// Answered with Ack, also when it is so already; "tab.unknown";
// "tab.no_page"; "window.private"; or "favourite.too_many" (a row has at
// most twelve).
message SetFavourite {
  uint64 tab_id = 1;
  bool favourite = 2;
}

// The layout of a window (043). Since 1.33.
enum Layout {
  // A core from before 1.33 names none: the strip.
  LAYOUT_UNSPECIFIED = 0;
  // The tabs along the top.
  LAYOUT_STRIP = 1;
  // The tabs down the side.
  LAYOUT_SIDEBAR = 2;
}

// Since 1.33. Switches a window's layout (043), and nothing else: no tab is
// moved, loaded or closed by it. The choice is the app's from then on: a
// window opened afterwards has it, also after the app has been closed. A
// private window's choice is its own, and is not kept (037). Answered with
// Ack, also when the window has that layout already; "window.unknown"; or
// "layout.unknown" for a layout this core does not have.
message SetLayout {
  uint64 window_id = 1;
  Layout layout = 2;
}

// Since 1.34. Undoes the newest thing done to arrange the row a window shows
// (044): a tab kept or let go, a Group made, named, coloured or removed, a tab
// put in a Group or taken out, a Favourite made or unmade. The row is put
// back as it was before that: every tab that is still in it is what it was,
// and where it was among those; a tab closed since stays closed (Undo is its
// way back), and one opened since stays. No page is loaded, closed, put to
// sleep or woken by it. It is apart from Undo, which is a closed tab's.
// Answered with Ack; "window.unknown"; or "undo.nothing".
message UndoArrangement {
  uint64 window_id = 1;
}

// Since 1.35. A part of a row that a tab can be moved to the end of (045). A
// Group's end is named by the Group.
enum RowPart {
  ROW_PART_UNSPECIFIED = 0;
  // The Favourites.
  ROW_PART_FAVOURITES = 1;
  // The Sites that are in no Group.
  ROW_PART_SITES = 2;
  // The tabs that are no Sites.
  ROW_PART_TABS = 3;
}

// Since 1.35. One place along a row (045).
enum RowStep {
  ROW_STEP_UNSPECIFIED = 0;
  // Towards the row's start.
  ROW_STEP_BACK = 1;
  // Towards the row's end.
  ROW_STEP_FORWARD = 2;
}

// Since 1.35. Moves a tab to another place in its row (045). A row has parts,
// in an order that does not change: the Favourites; the Sites that are in no
// Group; each Group's Sites; the tabs that are no Sites. A tab that is moved
// to another part becomes of it, as by the command that makes it so: a
// Favourite, a Site, a Site of a Group, or a tab that is no Site. Within its
// part it is only put in its place. A shell says what was moved and where it
// was dropped, and does not work out what the tab becomes.
//
// Nothing else changes: no page is loaded, closed, put to sleep or woken, and
// the tab in front stays in front. A move that is refused moves nothing.
// UndoArrangement undoes it ("tab.moved").
//
// Answered with Ack; "tab.unknown"; "move.nowhere" (no place named, or one
// this core does not know); "move.other_row" (the tab named as the place is
// not in the row); "group.unknown"; and what keeping a tab or making a
// Favourite is refused with: "tab.no_page", "window.private",
// "favourite.too_many".
message MoveTab {
  uint64 tab_id = 1;
  oneof to {
    // Just before this tab of the same row, as one of its part. Before
    // itself, a tab stays where it is.
    uint64 before_tab_id = 2;
    // The end of a part of the row.
    RowPart end_of = 3;
    // The end of a Group of the row.
    uint64 end_of_group_id = 4;
    // One place, among the tabs of its own part: at the end of its part it
    // stays, and is what it was.
    RowStep by = 5;
  }
}

// Since 1.35. Moves a Group among its row's Groups (045): before another, or
// after the last. Its Sites go with it. UndoArrangement undoes it
// ("group.reordered"). Answered with Ack; or "group.unknown", for either.
message MoveGroup {
  uint64 group_id = 1;
  // The Group it is put before; 0 to put it after the last.
  uint64 before_group_id = 2;
}

// Since 1.37. Asks for icons by their numbers (046). Answered with IconsPage:
// the pictures of the numbers the core has, in the order asked; a number it
// has not is left out.
message QueryIcons {
  repeated uint64 icon_ids = 1;
}

message IconsPage {
  repeated Icon icons = 1;
}

// A site's icon: a PNG of at most 256 pixels each way.
message Icon {
  uint64 icon_id = 1;
  bytes png = 2 [(wt.redact) = true];
}

// A window, as its subscription publishes it.
message WindowSnapshot {
  uint64 window_id = 1;
  // The tab in front, whole: the page a shell shows, and what its controls
  // act on.
  TabView tab = 2;
  // Every tab of the window, the one in front among them, in the order they
  // are shown.
  repeated TabSummary tabs = 3;
  // Since 1.9. How many downloads of the window's login set are coming
  // (013): enough to show that something is, without asking.
  uint32 downloads_active = 4;
  // Since 1.18. The Space the window shows (024): `tabs` are its tabs.
  uint64 space_id = 5;
  // Since 1.18. That Space's name. Empty for the Space the app made itself,
  // until the person names it: the shell shows its own word.
  string space_name = 6 [(wt.redact) = true];
  // Since 1.19. That Space's colour (025): one of SpacesPage.colours, or
  // empty for none.
  string space_colour = 7;
  // Since 1.24. What Undo would undo now in the Space the window shows
  // (033), by its kind: "tab.closed" when a closed tab can be brought back;
  // empty when there is nothing to undo.
  string undo = 8;
  // Since 1.26. The window is private (037). A shell says so in words.
  bool private_window = 9;
  // Since 1.31. The Groups of the row the window shows (041), in their
  // order. The row is: the Favourites (since 1.32); the Sites that are in no
  // Group; then each Group's Sites, Group by Group in this order; then the
  // tabs that are no Sites.
  // `tabs` has the Sites of a Group that is shut left out, but for the tab in
  // front, which is always there: a shut Group, and one with no Site, is
  // drawn from this list alone.
  repeated GroupSummary groups = 10;
  // Since 1.32. The row has as many Favourites as a row can have (042):
  // marking another would be refused ("favourite.too_many"). A shell offers
  // no more by it, and needs no number of its own.
  bool favourites_full = 11;
  // Since 1.33. How the window lays out its tabs (043). A view setting: the
  // row, its order and everything else here are the same in every layout.
  // A shell that cannot draw the one named draws the strip.
  Layout layout = 12;
  // Since 1.34. What UndoArrangement would undo in the row the window shows
  // (044), by its kind: "site.kept", "site.let_go", "group.made",
  // "group.removed", "group.renamed", "group.coloured", "group.moved",
  // "favourite.added", "favourite.removed", and since 1.35 "tab.moved" and
  // "group.reordered"; empty when there is nothing. A
  // kind a shell does not know is undone all the same: it is named only.
  string undo_arrangement = 13;
}

// A tab as a strip of tabs shows it: enough to name it, and no more.
message TabSummary {
  uint64 tab_id = 1;
  // The page's title. Empty: the shell shows `host`, or its words for a new
  // tab when that is empty too.
  string title = 2 [(wt.redact) = true];
  // The host of the address the tab shows, in its ASCII form. As in the
  // address field, it is the page's only once the page has committed.
  string host = 3 [(wt.redact) = true];
  bool loading = 4;
  // Since 1.29. The tab is a Site (039): kept, among the first of its row,
  // and asleep, not gone, when it is closed.
  bool kept = 5;
  // Since 1.29. It has no page now: a Site that was closed, or a tab that
  // came back after a quit and has not been in front since. Bringing it in
  // front loads it.
  bool asleep = 6;
  // Since 1.30. A Site that is awake and shows an address that is not its
  // home's: SendSiteHome sends it back.
  bool away = 7;
  // Since 1.30. The name a Site was kept with: what it is called when the
  // page it shows is not its home. Empty for a tab that is no Site.
  string site_name = 8 [(wt.redact) = true];
  // Since 1.31. The Group a Site is in (041); 0 for a tab that is in none.
  uint64 group_id = 9;
  // Since 1.32. The Site is one of the row's Favourites (042): they are the
  // first of the row, in their order, and none is in a Group.
  bool favourite = 10;
  // Since 1.36. Whether MoveTab by a step back, or forward, would move the
  // tab (045): there is a tab of its part of the row before it, or after it.
  // A command that asks for the step is offered when it is so. (The tab of
  // its part beside it may be one that is out of the way, in a shut Group.)
  bool steps_back = 11;
  bool steps_forward = 12;
  // Since 1.37. The number of the tab's icon (046); 0 for a tab that has
  // none. A tab has the icon of the host of the page it shows, in its login
  // set; a Site, of its home's host, wherever it has wandered. A number is
  // one picture for as long as the core runs: a shell asks for the pictures
  // it has not got (QueryIcons), once, and keeps them.
  uint64 icon_id = 13;
}

message TabView {
  uint64 tab_id = 1;
  // The web view the shell shows for this tab; 0 while it has none.
  uint64 web_view_id = 2;
  AddressView address = 3;
  // The page's title. Empty: the shell shows the address's host.
  string title = 4 [(wt.redact) = true];
  LoadState load_state = 5;
  // 0 to 1 while LOAD_STATE_LOADING.
  double progress = 6;
  bool can_go_back = 7;
  bool can_go_forward = 8;
  // With LOAD_STATE_FAILED: why, such as "net.dns" or "page.renderer_gone".
  string error_code = 9;
  EngineKind engine = 10;
  // The login set the tab's pages run in, as a UUID.
  string login_set_id = 11 [(wt.redact) = true];
  // Since 1.6. What the tab's find has found (010). Not set while the tab
  // has no find.
  FindView find = 12;
  // Since 1.8. What the tab's page is zoomed to (012). Not set while the tab
  // has no page with a site.
  ZoomView zoom = 13;
  // Since 1.10. What the tab asks the person (014). Not set when it asks
  // nothing. One at a time: what else waits is shown when this is answered.
  PromptView prompt = 14;
  // Since 1.20 (026). With LOAD_STATE_FAILED: the load failed for its site's
  // certificate, and the person may go on all the same
  // (ProceedPastCertificate). A shell warns before it offers that.
  bool certificate_passable = 15;
  // Since 1.20. With `certificate_passable`: the host whose certificate was
  // not trusted, in its ASCII form, for the warning's words.
  string certificate_host = 16 [(wt.redact) = true];
  // Since 1.29. The tab is a Site (039).
  bool kept = 17;
  // Since 1.30. As TabSummary's: the tab is a Site that is away from its
  // home, and the name it was kept with.
  bool away = 18;
  string site_name = 19 [(wt.redact) = true];
  // Since 1.32. The tab is one of its row's Favourites (042).
  bool favourite = 20;
}

enum LoadState {
  LOAD_STATE_UNSPECIFIED = 0;
  // Nothing is loading: an empty tab or a finished page.
  LOAD_STATE_IDLE = 1;
  LOAD_STATE_LOADING = 2;
  LOAD_STATE_FAILED = 3;
}

// What the address field shows. The core builds it so that every shell shows
// the same thing and none can be made to lie: a page-initiated load does not
// change it until the page commits.
message AddressView {
  // The whole address. Empty on an empty tab.
  string url = 1 [(wt.redact) = true];
  // What the field shows while it is not being edited: host and path, with
  // the scheme only when it is not https.
  string display = 2 [(wt.redact) = true];
  // The host in its ASCII form, so a look-alike international name reads as
  // what it is.
  string host = 3 [(wt.redact) = true];
  // The part of the host a shell emphasises ("example.co.uk"). Empty for an
  // IP address or a local name.
  string registrable_domain = 4 [(wt.redact) = true];
  Security security = 5;

  enum Security {
    // No page: an empty tab, a load that failed, or an address the tab was
    // sent to whose page has not arrived. The mark speaks of a page that
    // has arrived: a failed load says this since 1.20 (026), and an address
    // on its way since 1.21 (029), whatever the address is. (A site whose
    // certificate a person went on past is SECURITY_INSECURE throughout.)
    SECURITY_UNSPECIFIED = 0;
    // https.
    SECURITY_SECURE = 1;
    // http.
    SECURITY_INSECURE = 2;
    // The browser's own pages and local content: about:, file:, data:.
    SECURITY_LOCAL = 3;
  }
}

// History (008). Since 1.5.

// Asks for a page of a window's history: the visits of its Space's login
// set, newest first. Answered with HistoryPage, or "window.unknown".
//
// History is asked for, not subscribed to: a list that is being read does
// not move under the reader.
message QueryHistory {
  uint64 window_id = 1;
  // Words to look for. Each must be found in a visit's title or address, as
  // a word or the start of one, whatever its case. Empty: every visit.
  string text = 2 [(wt.redact) = true];
  // At most this many. 0 asks for the core's own page (100); more than 500
  // is 500.
  uint32 limit = 3;
  // Only visits older than this one: the last entry of the page before. 0:
  // from the newest.
  uint64 before_visit_id = 4;
}

message HistoryPage {
  repeated HistoryEntry entries = 1;
  // There are older visits than these that match.
  bool more = 2;
}

// A page that was seen.
message HistoryEntry {
  // Never used twice. A later visit has a greater one.
  uint64 visit_id = 1;
  string url = 2 [(wt.redact) = true];
  // The page's title. Empty when it had none: a shell shows `display`.
  string title = 3 [(wt.redact) = true];
  // The address as the address field shows it.
  string display = 4 [(wt.redact) = true];
  // When, in milliseconds since 1970-01-01 UTC.
  int64 visited_at_ms = 5;
}

// Forgets visits of a window's Space's login set: gone from the store's
// files, not only from the list. Answered with Ack (also when there was
// nothing to forget), "window.unknown", or "history.nothing_named" when
// `what` is not set.
message ForgetHistory {
  uint64 window_id = 1;
  oneof what {
    // This visit.
    uint64 visit_id = 2;
    // Every visit at or after this time, in milliseconds since 1970 UTC.
    int64 since_ms = 3;
    // Every visit. Only `true` means it.
    bool everything = 4;
  }
}

// Find on the page (010). Since 1.6.

// Finds text in a tab's page: the first match, or with the same text again
// the next one, or the one before with `backwards`. Empty text stops
// finding: the marks are cleared, and the tab has no find. Answered with
// Ack, "tab.unknown", or "tab.no_page" for a tab with no web view.
message FindInPage {
  uint64 tab_id = 1;
  string text = 2 [(wt.redact) = true];
  bool backwards = 3;
}

// What a tab's find has found. A shell draws it and keeps no count of its
// own.
message FindView {
  // The text looked for.
  string text = 1 [(wt.redact) = true];
  // The engine has said something about this text. Until then nothing is
  // known: a find just asked for is not "not found".
  bool answered = 2;
  // With `answered`: the text is on the page.
  bool found = 3;
  // The engine counts matches: `matches` and `current` mean something.
  // WebKit does not.
  bool counted = 4;
  uint32 matches = 5;
  // Which match is shown, counted from 1. 0 when none is.
  uint32 current = 6;
}

// Places offered as the address field is typed in (011). Since 1.7.

// Asks what to offer for what is typed in a window's address field: since
// 1.27 the open tabs of the row the window shows (038), and then places
// from its Space's own history, best first. Nothing typed leaves the
// device. Answered with AddressSuggestions, or "window.unknown".
//
// Asked for, not subscribed to: each letter typed is a question, and a shell
// shows only the answer to what is now in its field.
message SuggestAddresses {
  uint64 window_id = 1;
  string text = 2 [(wt.redact) = true];
  // At most this many. 0 asks for the core's own number (6); more than 20
  // is 20.
  uint32 limit = 3;
}

message AddressSuggestions {
  // Best first.
  repeated AddressSuggestion suggestions = 1;
}

// A place that was visited, offered again; or, since 1.27, a tab that is open.
message AddressSuggestion {
  // Where choosing it goes.
  string url = 1 [(wt.redact) = true];
  // The title it last had. Empty when it had none: a shell shows `display`.
  string title = 2 [(wt.redact) = true];
  // The address as the address field shows it.
  string display = 3 [(wt.redact) = true];
  // Since 1.27. Not 0: an open tab of the window that shows this page (038).
  // Choosing it brings that tab in front (ActivateTab) and loads nothing.
  uint64 tab_id = 4;
}

// Zoom (012). Since 1.8.

// Makes the page of a tab bigger or smaller, or puts it back to actual size.
// The level is its site's, in the tab's login set: every tab that shows the
// site is given it, and it is remembered. Answered with Ack, also when there
// is no further level; "tab.unknown"; "tab.no_page" for a tab with no page,
// or a page with no site; "tab.bad_command" for a change that is none of
// the three.
message ZoomPage {
  uint64 tab_id = 1;
  ZoomChange change = 2;
}

enum ZoomChange {
  ZOOM_CHANGE_UNSPECIFIED = 0;
  // Bigger: the next level up.
  ZOOM_CHANGE_IN = 1;
  // Smaller: the next level down.
  ZOOM_CHANGE_OUT = 2;
  // Actual size: 100%.
  ZOOM_CHANGE_RESET = 3;
}

// What a tab's page is zoomed to: what the core asked of its web view, not
// what an engine says it did. A shell does not know the levels: it is told
// whether there is one above and one below.
message ZoomView {
  // 100 is actual size.
  uint32 percent = 1;
  bool can_zoom_in = 2;
  bool can_zoom_out = 3;
}

// Downloads (013). Since 1.9.

// Asks for a window's downloads: those of its Space's login set, newest
// first. Answered with DownloadsPage, or "window.unknown".
message QueryDownloads {
  uint64 window_id = 1;
  // Only downloads older than this one. 0 starts at the newest.
  uint64 before_id = 2;
  // At most this many. 0 asks for the core's own number (100).
  uint32 limit = 3;
}

message DownloadsPage {
  repeated DownloadEntry downloads = 1;
  // There are older downloads than these.
  bool more = 2;
}

// A download, as a list shows it.
message DownloadEntry {
  // The core's own, never used twice. What CancelDownload and
  // ForgetDownloads name it by.
  uint64 id = 1;
  string url = 2 [(wt.redact) = true];
  // The site it came from, as an address field shows a host. Empty when its
  // address has none.
  string host = 3 [(wt.redact) = true];
  // The name its file is saved under: the one asked for while it is coming,
  // the one the shell used once it has finished.
  string file_name = 4 [(wt.redact) = true];
  string mime_type = 5;
  // How big the file is. 0 when the site did not say.
  uint64 total_bytes = 6;
  // How much of it has arrived, while it is coming.
  uint64 received_bytes = 7;
  DownloadState state = 8;
  // With DOWNLOAD_STATE_FAILED: why.
  string error_code = 9;
  // When it started, in milliseconds since 1970.
  int64 started_ms = 10;
}

enum DownloadState {
  DOWNLOAD_STATE_UNSPECIFIED = 0;
  DOWNLOAD_STATE_COMING = 1;
  DOWNLOAD_STATE_FINISHED = 2;
  DOWNLOAD_STATE_FAILED = 3;
}

// Stops a download that is coming. It ends as "download.cancelled", and the
// shell removes what was saved of it. Answered with Ack, or
// "download.unknown" for one that is not coming.
message CancelDownload {
  uint64 download_id = 1;
}

// Since 1.22. Opens a finished download's file with whatever the system has
// for its kind (030): a person pressed it in the list. The core asks the
// shell's System service (OpenFile) and answers as it answers. Answered with
// Ack; "window.unknown"; "download.unknown" for one that is not on the
// window's list; "download.not_finished" for one that is coming or that
// failed; or the shell's "system.no_handler" or "download.missing".
message OpenDownload {
  uint64 window_id = 1;
  uint64 download_id = 2;
}

// Takes downloads off a window's list: one, or all of them. One that is
// still coming is stopped first. The files are not touched. Answered with
// Ack; "window.unknown"; "download.nothing_named" when it says neither.
message ForgetDownloads {
  uint64 window_id = 1;
  oneof what {
    uint64 download_id = 2;
    bool everything = 3;
  }
}

// What a tab asks the person, for a shell to draw in that tab: never over
// the window, and never answered by a key that was meant for the page. A
// prompt names who asks in the core's words; nothing in it is the page's.
message PromptView {
  // The core's own, never used twice. What the answer names it by.
  uint64 prompt_id = 1;
  oneof kind {
    PermissionPrompt permission = 2;
    // Since 1.11
    DownloadPrompt download = 3;
    // Since 1.12
    DialogPrompt dialog = 4;
    // Since 1.13
    SignInPrompt sign_in = 5;
  }
}

// A server asks for a name and a password before it answers (017). Nothing
// in it is the server's own words.
message SignInPrompt {
  // The server that asks, as an address field shows a site. It is who gets
  // what is typed.
  string site = 1 [(wt.redact) = true];
  // What is typed reaches the server unread: https, or this device itself.
  // When it is not so, a shell says that it can be read on the way.
  bool confidential = 2;
  // The server refused what was sent before.
  bool again = 3;
}

// A page says something, or asks (016). The words are the page's, and a
// shell shows them as the page's: under `site`, which is the core's.
message DialogPrompt {
  // Who says it, as an address field shows it.
  string site = 1 [(wt.redact) = true];
  DialogKind kind = 2;
  // The page's words, cut to 2,000 characters.
  string message = 3 [(wt.redact) = true];
  // With DIALOG_KIND_PROMPT: the text the page offers, cut the same.
  string default_text = 4 [(wt.redact) = true];
  // The page said something before: the person may stop its messages
  // (AnswerPrompt.silence).
  bool may_silence = 5;
}

// A page asks to download a file, and its site was not yet allowed to (015).
// Nothing is saved, and nothing is listed, until the person has said.
message DownloadPrompt {
  // Who asks, as an address field shows it: the page's own site, or with
  // no page in the tab, where the file comes from.
  string site = 1 [(wt.redact) = true];
  // The name the file would be saved under: the core's (013), made safe.
  string file_name = 2 [(wt.redact) = true];
}

// A page asks to use something of the device's (014).
message PermissionPrompt {
  // Who asks, as an address field shows it: the page's own host.
  string site = 1 [(wt.redact) = true];
  repeated PermissionKind kinds = 2;
}

// The person's answer to the prompt a tab shows. Answered with Ack;
// "tab.unknown"; "prompt.unknown" when the tab's window shows no such prompt:
// it was answered already, its page went away, or its tab is not in front;
// "prompt.too_soon" when the prompt has been in a snapshot for less than
// half a second. A press that was on its way to the page when the prompt
// appeared under it must not answer for the person: a shell that is told so
// leaves the prompt where it is, and the person presses again.
//
// For a DownloadPrompt (since 1.11): `allow` starts the download, and the
// site's later downloads start with nobody asked, until that is taken back
// (ForgetPermissions). Not allowing drops it, and the page's later downloads
// with it until another page has loaded.
//
// For a PermissionPrompt: `allow` lets the page use what it asked for, and
// is remembered for its origin in its login set until it is taken back
// (ForgetPermissions). Not allowing is for this page only: it is told no,
// and does not get to ask for the same again until another page has loaded.
//
// For a DialogPrompt (since 1.12): `allow` is OK, with `text` for a prompt;
// not allowing is Cancel. With `silence`, where the prompt says it may be
// silenced: this dialog is dismissed, and so is every other of the page's,
// now and later, until another page has loaded.
//
// For a SignInPrompt (since 1.13): `allow` answers the server with `text` as
// the name and `secret` as the password; not allowing gives it no answer.
// Either way every other question of the same server that waits has the
// same answer.
message AnswerPrompt {
  uint64 tab_id = 1;
  uint64 prompt_id = 2;
  bool allow = 3;
  // Since 1.12
  string text = 4 [(wt.redact) = true];
  bool silence = 5;
  // Since 1.13
  string secret = 6 [(wt.redact) = true];
}

// Asks what the sites of a window's login set were allowed to use. Answered
// with PermissionsPage, or "window.unknown".
message QueryPermissions {
  uint64 window_id = 1;
}

message PermissionsPage {
  // In the order of their names as shown.
  repeated SitePermissions sites = 1;
}

message SitePermissions {
  // Scheme, host and port. What ForgetPermissions names it by.
  string origin = 1 [(wt.redact) = true];
  // As an address field shows it.
  string site = 2 [(wt.redact) = true];
  // What it was allowed.
  repeated PermissionKind kinds = 3;
}

// Takes back what one origin was allowed in a window's login set, or what
// every origin was. Answered with Ack; "window.unknown";
// "permission.nothing_named". It stops nothing that is running: the page
// asks again the next time it wants what it had.
message ForgetPermissions {
  uint64 window_id = 1;
  oneof what {
    string origin = 2 [(wt.redact) = true];
    bool everything = 3;
  }
}

// Asks where searches go (020): the engines the core knows, and the one in
// use. Answered with SearchSettings.
message QuerySearch {}

message SearchSettings {
  // The engines a person chooses among, in the order they are listed.
  repeated SearchEngine engines = 1;
  // Where searches go now: one of `engines`.
  string chosen_id = 2;
  // The person chose it, or kept it. False: nobody has yet, and searches go
  // to the default, which `chosen_id` then names. A shell that is told so
  // shows the choice once, with the default to keep: keeping it is choosing
  // it (ChooseSearchEngine with that id).
  bool chosen = 3;
}

message SearchEngine {
  // The core's name for it: what a choice names it by.
  string id = 1;
  // Its own name, which is not translated.
  string name = 2;
  // Where searches are sent, for a shell to show under the name.
  string host = 3;
}

// The person's choice of where searches go (020): one of the engines in
// SearchSettings. It is the whole app's, and holds until another is chosen.
// Answered with Ack, or "search.unknown_engine" for a name the core does
// not have, which changes nothing.
message ChooseSearchEngine {
  string id = 1;
}

// Since 1.18. Asks for the Spaces (024), in their order. Answered with
// SpacesPage.
message QuerySpaces {}

message SpacesPage {
  repeated SpaceSummary spaces = 1;
  // Since 1.19. The colours a Space can have (025), by the core's names for
  // them, in their order. A shell has the paint and the word for each; one
  // it has neither for is shown as no colour.
  repeated string colours = 2;
}

message SpaceSummary {
  uint64 space_id = 1;
  // Empty for the Space the app made itself, until the person names it.
  string name = 2 [(wt.redact) = true];
  // Spaces with the same number here share their logins. It is a number of
  // the core's own for this answer, and says nothing else of the logins.
  uint32 logins = 3;
  // Since 1.19. Its colour: one of SpacesPage.colours, or empty for none.
  string colour = 4;
}

// Since 1.18. Makes a Space (024), after the others. Its name is what was
// typed without the white space at its ends, cut at 60 characters. Answered
// with SpaceCreated; or "space.name_empty", "space.too_many" (there may be
// 32), or "space.unknown" for logins of a Space that is not there. Refused,
// nothing is made.
message CreateSpace {
  string name = 1 [(wt.redact) = true];
  // The Space whose logins it shares; 0 for logins of its own. It is chosen
  // here, and not changed after.
  uint64 share_logins_with = 2;
  // Since 1.19. Its colour: one of SpacesPage.colours. Empty: the core
  // gives it the first that no Space has. One that is not in the list is
  // refused with "space.colour_unknown", and nothing is made.
  string colour = 3;
}

message SpaceCreated {
  uint64 space_id = 1;
}

// Since 1.18. Names a Space (024), by the rule for a new one's name.
// Answered with Ack, "space.unknown" or "space.name_empty".
message RenameSpace {
  uint64 space_id = 1;
  string name = 2 [(wt.redact) = true];
}

// Since 1.18. A window shows another Space (024): that Space's tabs, with
// the one in front that was in front when it was last shown. The tabs of
// the Space it showed stay as they are, and nothing is asked of their web
// views. Answered with Ack (also for the Space the window shows already),
// "window.unknown" or "space.unknown".
message SwitchSpace {
  uint64 window_id = 1;
  uint64 space_id = 2;
}

// Since 1.19. Gives a Space a colour (025): one of SpacesPage.colours, or
// none (empty). Answered with Ack, "space.unknown", or
// "space.colour_unknown" for a name that is not in the list, which changes
// nothing.
message ColourSpace {
  uint64 space_id = 1;
  string colour = 2;
}

// Since 1.20. The person goes on past a certificate that is not trusted
// (026), in a tab whose view says it may be (`certificate_passable`). The
// core has the shell let that certificate through, for that host and port,
// in the tab's login set, until the app quits; and loads the address again.
// Every page of that host is then marked not secure. Answered with Ack,
// "tab.unknown", or "certificate.not_passable" for a tab whose failed load
// is not one that may be gone on with, which changes nothing.
message ProceedPastCertificate {
  uint64 tab_id = 1;
}

// Since 1.21. A search for words the person chose somewhere a shell can hear
// of, outside any page (028): another app's selected text. The words are
// tidied as selected words of a page are (023), and are always searched for
// with the engine the person chose: never taken for an address, whatever
// they look like. The search opens in a new tab, after the tab in front, in
// front, in the Space the window shows. Answered with TabOpened;
// "window.unknown"; or "search.no_words" when nothing is left of the words,
// which opens nothing.
message SearchWords {
  uint64 window_id = 1;
  string text = 2 [(wt.redact) = true];
}

// Since 1.23. An address the system handed the shell from outside WebTiger:
// a link pressed in another app (031). Opened only when it is an address of
// the web (http or https, whole, with a host), in a new tab after the tab in
// front, in front, in the Space the window shows. It is not typed text:
// never mended, and never searched for; and nothing of it is handed on to
// the system. Answered with TabOpened; "window.unknown"; or
// "address.not_web", which opens nothing.
message OpenAddress {
  uint64 window_id = 1;
  string url = 2 [(wt.redact) = true];
}

// Since 1.24. Undoes the last organising action of the Space a window shows
// (033): so far, brings back the tab the person last closed there, at the
// place it had, in front, loading its address. What it would undo is in
// WindowSnapshot.undo. Answered with TabOpened for a tab brought back;
// "window.unknown"; or "undo.nothing" when there is nothing to undo.
message Undo {
  uint64 window_id = 1;
}

// Since 1.25. Brings another tab of a window in front, by where it is in the
// row the window shows (035): the next, and from the last the first; the one
// before, and from the first the last; the last; or the tab at a place.
// Coming in front is what ActivateTab makes it. Answered with Ack, also when
// nothing changes (one tab, a place beyond the row, the tab already in
// front); "window.unknown"; or "tab.step" when no way to go is said.
message StepTab {
  uint64 window_id = 1;
  enum To {
    TO_UNSPECIFIED = 0;
    TO_NEXT = 1;
    TO_PREVIOUS = 2;
    TO_LAST = 3;
    // The tab at `place`.
    TO_PLACE = 4;
  }
  To to = 2;
  // For TO_PLACE: the place in the row, counted from one. Beyond the row,
  // nothing happens.
  uint32 place = 3;
}
