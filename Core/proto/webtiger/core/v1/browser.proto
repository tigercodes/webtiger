// Windows and tabs: what a shell asks for and what it draws.
//
// A window has tabs in an order, and one of them in front (1.1; 005). W2
// builds the sidebar tree and the tab strip over them; the requests here
// stay.
syntax = "proto3";

package webtiger.core.v1;

import "webtiger/core/v1/common.proto";
import "wt/options.proto";

option java_multiple_files = true;
option java_package = "com.tigercodes.webtiger.core.v1";
option swift_prefix = "WT";

// Opens a window in the default Space, with one tab. Answered with
// WindowOpened. In fake mode the tab opens FakeOptions.start_address.
message OpenWindow {}

message WindowOpened {
  uint64 window_id = 1;
  uint64 tab_id = 2;
}

// Closes a window: its tabs' web views are destroyed and its subscriptions
// end. Answered with Ack, or "window.unknown".
message CloseWindow {
  uint64 window_id = 1;
}

// What the user typed in the address field, as typed. The core decides
// whether it is an address or a search, fixes it up, and loads it in the tab.
// Answered with Ack once the web view was told to load, or an Error:
// "address.empty", "tab.unknown", or the host's.
message SubmitAddress {
  uint64 tab_id = 1;
  string text = 2 [(wt.redact) = true];
}

// Back, forward, reload or stop for a tab. Answered with Ack, "tab.unknown",
// or "tab.no_page" when the tab has no web view yet.
message TabCommand {
  uint64 tab_id = 1;
  NavigationCommand command = 2;
}

// Opens a tab in a window. Answered with TabOpened once its page, if it was
// given one, was asked of the shell, or with "window.unknown". A tab given no
// text is empty and has no web view.
message OpenTab {
  uint64 window_id = 1;
  // What the tab opens, as it would be typed in an address field: the core
  // decides whether it is an address or a search. Empty: an empty tab.
  string text = 2 [(wt.redact) = true];
  // Leave the tab in front where it is; the new one opens behind it.
  bool background = 3;
  // The tab the new one is put after, when it is a tab of this window.
  // Otherwise, and for 0, the new tab goes at the end.
  uint64 after_tab_id = 4;
}

message TabOpened {
  uint64 tab_id = 1;
}

// Closes a tab: its web view is destroyed. If it was in front, the tab after
// it comes forward, or the one before it when it was the last. A window
// always has a tab: an empty one takes the place of its only tab. Answered
// with Ack, or "tab.unknown".
message CloseTab {
  uint64 tab_id = 1;
}

// Brings a tab in front in its window. Answered with Ack, or "tab.unknown".
message ActivateTab {
  uint64 tab_id = 1;
}

// A window, as its subscription publishes it.
message WindowSnapshot {
  uint64 window_id = 1;
  // The tab in front, whole: the page a shell shows, and what its controls
  // act on.
  TabView tab = 2;
  // Every tab of the window, the one in front among them, in the order they
  // are shown.
  repeated TabSummary tabs = 3;
}

// A tab as a strip of tabs shows it: enough to name it, and no more.
message TabSummary {
  uint64 tab_id = 1;
  // The page's title. Empty: the shell shows `host`, or its words for a new
  // tab when that is empty too.
  string title = 2 [(wt.redact) = true];
  // The host of the address the tab shows, in its ASCII form. As in the
  // address field, it is the page's only once the page has committed.
  string host = 3 [(wt.redact) = true];
  bool loading = 4;
}

message TabView {
  uint64 tab_id = 1;
  // The web view the shell shows for this tab; 0 while it has none.
  uint64 web_view_id = 2;
  AddressView address = 3;
  // The page's title. Empty: the shell shows the address's host.
  string title = 4 [(wt.redact) = true];
  LoadState load_state = 5;
  // 0 to 1 while LOAD_STATE_LOADING.
  double progress = 6;
  bool can_go_back = 7;
  bool can_go_forward = 8;
  // With LOAD_STATE_FAILED: why, such as "net.dns" or "page.renderer_gone".
  string error_code = 9;
  EngineKind engine = 10;
  // The login set the tab's pages run in, as a UUID.
  string login_set_id = 11 [(wt.redact) = true];
  // Since 1.6. What the tab's find has found (010). Not set while the tab
  // has no find.
  FindView find = 12;
}

enum LoadState {
  LOAD_STATE_UNSPECIFIED = 0;
  // Nothing is loading: an empty tab or a finished page.
  LOAD_STATE_IDLE = 1;
  LOAD_STATE_LOADING = 2;
  LOAD_STATE_FAILED = 3;
}

// What the address field shows. The core builds it so that every shell shows
// the same thing and none can be made to lie: a page-initiated load does not
// change it until the page commits.
message AddressView {
  // The whole address. Empty on an empty tab.
  string url = 1 [(wt.redact) = true];
  // What the field shows while it is not being edited: host and path, with
  // the scheme only when it is not https.
  string display = 2 [(wt.redact) = true];
  // The host in its ASCII form, so a look-alike international name reads as
  // what it is.
  string host = 3 [(wt.redact) = true];
  // The part of the host a shell emphasises ("example.co.uk"). Empty for an
  // IP address or a local name.
  string registrable_domain = 4 [(wt.redact) = true];
  Security security = 5;

  enum Security {
    // No page: an empty tab.
    SECURITY_UNSPECIFIED = 0;
    // https.
    SECURITY_SECURE = 1;
    // http.
    SECURITY_INSECURE = 2;
    // The browser's own pages and local content: about:, file:, data:.
    SECURITY_LOCAL = 3;
  }
}

// History (008). Since 1.5.

// Asks for a page of a window's history: the visits of its Space's login
// set, newest first. Answered with HistoryPage, or "window.unknown".
//
// History is asked for, not subscribed to: a list that is being read does
// not move under the reader.
message QueryHistory {
  uint64 window_id = 1;
  // Words to look for. Each must be found in a visit's title or address, as
  // a word or the start of one, whatever its case. Empty: every visit.
  string text = 2 [(wt.redact) = true];
  // At most this many. 0 asks for the core's own page (100); more than 500
  // is 500.
  uint32 limit = 3;
  // Only visits older than this one: the last entry of the page before. 0:
  // from the newest.
  uint64 before_visit_id = 4;
}

message HistoryPage {
  repeated HistoryEntry entries = 1;
  // There are older visits than these that match.
  bool more = 2;
}

// A page that was seen.
message HistoryEntry {
  // Never used twice. A later visit has a greater one.
  uint64 visit_id = 1;
  string url = 2 [(wt.redact) = true];
  // The page's title. Empty when it had none: a shell shows `display`.
  string title = 3 [(wt.redact) = true];
  // The address as the address field shows it.
  string display = 4 [(wt.redact) = true];
  // When, in milliseconds since 1970-01-01 UTC.
  int64 visited_at_ms = 5;
}

// Forgets visits of a window's Space's login set: gone from the store's
// files, not only from the list. Answered with Ack (also when there was
// nothing to forget), "window.unknown", or "history.nothing_named" when
// `what` is not set.
message ForgetHistory {
  uint64 window_id = 1;
  oneof what {
    // This visit.
    uint64 visit_id = 2;
    // Every visit at or after this time, in milliseconds since 1970 UTC.
    int64 since_ms = 3;
    // Every visit. Only `true` means it.
    bool everything = 4;
  }
}

// Find on the page (010). Since 1.6.

// Finds text in a tab's page: the first match, or with the same text again
// the next one, or the one before with `backwards`. Empty text stops
// finding: the marks are cleared, and the tab has no find. Answered with
// Ack, "tab.unknown", or "tab.no_page" for a tab with no web view.
message FindInPage {
  uint64 tab_id = 1;
  string text = 2 [(wt.redact) = true];
  bool backwards = 3;
}

// What a tab's find has found. A shell draws it and keeps no count of its
// own.
message FindView {
  // The text looked for.
  string text = 1 [(wt.redact) = true];
  // The engine has said something about this text. Until then nothing is
  // known: a find just asked for is not "not found".
  bool answered = 2;
  // With `answered`: the text is on the page.
  bool found = 3;
  // The engine counts matches: `matches` and `current` mean something.
  // WebKit does not.
  bool counted = 4;
  uint32 matches = 5;
  // Which match is shown, counted from 1. 0 when none is.
  uint32 current = 6;
}

// Places offered as the address field is typed in (011). Since 1.7.

// Asks what to offer for what is typed in a window's address field: places
// from its Space's own history, best first. Nothing typed leaves the
// device. Answered with AddressSuggestions, or "window.unknown".
//
// Asked for, not subscribed to: each letter typed is a question, and a shell
// shows only the answer to what is now in its field.
message SuggestAddresses {
  uint64 window_id = 1;
  string text = 2 [(wt.redact) = true];
  // At most this many. 0 asks for the core's own number (6); more than 20
  // is 20.
  uint32 limit = 3;
}

message AddressSuggestions {
  // Best first.
  repeated AddressSuggestion suggestions = 1;
}

// A place that was visited, offered again.
message AddressSuggestion {
  // Where choosing it goes.
  string url = 1 [(wt.redact) = true];
  // The title it last had. Empty when it had none: a shell shows `display`.
  string title = 2 [(wt.redact) = true];
  // The address as the address field shows it.
  string display = 3 [(wt.redact) = true];
}
