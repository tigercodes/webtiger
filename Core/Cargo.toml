# WebTiger Core: the Rust core every shell links (docs/features/000-master-plan.md §5).
# "Core" is this workspace; "engine" always means a web engine (WebKit, Chromium).
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
publish = false

# Every dependency is declared once, here, so a version bump is one line and
# a new dependency is visible in review.
[workspace.dependencies]
wt-app = { path = "crates/wt-app" }
wt-core = { path = "crates/wt-core" }
wt-ffi = { path = "crates/wt-ffi" }
wt-guard = { path = "crates/wt-guard" }
wt-import = { path = "crates/wt-import" }
wt-proto = { path = "crates/wt-proto" }
wt-store = { path = "crates/wt-store" }
wt-testkit = { path = "crates/wt-testkit" }
# The contract's messages. Exactly the version of prost-build in
# tools/proto-gen, which wrote the checked-in code (wt-proto's tests check).
prost = "=0.14.4"
# wt-core: addresses by the WHATWG URL Standard (and, through it, IDNA), and
# the registrable domain from the Public Suffix List compiled into code, so
# start-up reads no list.
url = "2.5.9"
psl = "2.1"
# wt-core: random bytes for version 4 UUIDs (login sets).
getrandom = "0.4"
# wt-store: SQLite compiled from the bundled amalgamation, so FTS5 and the
# version are the same on every platform (the build flags are in
# .cargo/config.toml).
rusqlite = { version = "0.41", features = ["bundled"] }
# wt-ffi: the core's single-threaded runtime, its channels and the host
# bridge's timeouts. Each crate enables the tokio features it needs.
tokio = "1"
# wt-ffi: the fast path's immutable snapshot, swapped without a lock (§5.5).
arc-swap = "1.9"
# wt-guard: the blocker (000 §5.8, WT-D10; 064): Brave's adblock-rust, which
# decides whether a page may fetch a thing by the rules of the public lists.
# One exact version: what it saves, and what it converts for WebKit, are a
# version's own. Not built for one thread: the fast path asks from an
# engine's own threads, and the blocker is shared between them. Without its
# own resolver of domains: wt-core's registrable domain is the app's one
# answer to "is this the same site", handed over with each request.
adblock = { version = "=0.13.6", default-features = false, features = ["full-regex-handling"] }
# wt-ffi's Android glue: the JNI exports Kotlin's NativeCore calls (the `jni`
# feature).
jni = "0.22.4"
# wt-import: Arc's JSON files in, the portable format out. wt-cli prints it.
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
# wt-cli: the `webtiger` command line's arguments.
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
# Test only: scratch folders for the store and the importers.
tempfile = "3.27"

[workspace.lints.rust]
# Only wt-ffi may contain unsafe code, and it says so in its own lib.rs:
# every unsafe block carries a SAFETY comment and a test.
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
# No unwrap, expect or panic outside tests (clippy.toml allows them there).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# A RefCell borrow held across an await is a panic waiting for the next
# request: the app's state is borrowed only between awaits.
await_holding_refcell_ref = "deny"

# The panic fence needs unwinding. Overflow checks stay on: a wrap-around in
# length arithmetic is a security bug.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = true
opt-level = "s"
strip = "debuginfo"
