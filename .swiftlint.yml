included:
  - Packages/Sources
  - Packages/Tests
  - Apps
excluded:
  - Packages/.build
  # The contract, generated by Tools/proto/generate.sh.
  - Packages/Sources/WTContract
  # Design tokens, generated by Tools/design/tokens.py.
  - Packages/Sources/WTDesign/Tokens.generated.swift
  # The catalogue's strings by name, generated by Tools/strings/generate.sh.
  - Packages/Sources/WTUI/Words.generated.swift
  # The test site's pages, generated by Tools/testsite/site.py.
  - Packages/Tests/WTWebKitTests/TestSitePages.generated.swift
  - Tools
disabled_rules:
  - todo
  - trailing_comma
  # SwiftFormat owns where a wrapped signature's brace goes, and the order of modifiers.
  - opening_brace
opt_in_rules:
  - closure_spacing
  - contains_over_filter_is_empty
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: error
line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 600
  error: 1000
type_body_length:
  warning: 400
  error: 600
function_body_length:
  warning: 60
  error: 100
identifier_name:
  min_length: 2
  excluded: [id, x, y, to, at, ok, s, m, l, a, b, i, j, k, n, xs]
nesting:
  type_level: 2
cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true
